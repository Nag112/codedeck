; PlatformIO project for CodeDeck
; ESP32-S3 (native USB CDC) is the primary target. Classic ESP32 uses UART0.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCODEDECK_FW_VERSION=\"1.0.0\"
  -DCODEDECK_PROTOCOL=1
  -DCODEDECK_DEBOUNCE_MS=20
  -DCODEDECK_UPDATE_CHUNK=256

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DCODEDECK_KEYS=12
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default.csv

[env:esp32s3_9key]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DCODEDECK_KEYS=9
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default.csv

[env:esp32]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DCODEDECK_KEYS=12
board_build.partitions = default.csv
